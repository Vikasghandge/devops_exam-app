version: '3.8'

services:
  # ------------------------------
  # Backend Service (Flask)
  # ------------------------------
  flask:
    build: ./backend
    container_name: flask_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpass
      - MYSQL_DATABASE=devops_exam
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./frontend:/app/templates
    networks:
      - devops_network

  # ------------------------------
  # Database Service (MySQL)
  # ------------------------------
  mysql:
    image: mysql:5.7
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: devops_exam
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - devops_network

  # ------------------------------
  # Nginx Reverse Proxy
  # ------------------------------
  nginx:
    build: ./nginx
    container_name: nginx_proxy
    ports:
      - "8080:80"
    depends_on:
      - flask
    networks:
      - devops_network

# ------------------------------
# Volumes and Networks
# ------------------------------
volumes:
  mysql_data:
    driver: local

networks:
  devops_network:
    driver: bridge

